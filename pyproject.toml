[project]
name = "PumpR"
version = "1.1.0"
description = "Desktop application for simulating the performance of centrifugal pumps handling pure fluids or mixtures."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coolprop>=7.2.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pyside6>=6.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpr"]
